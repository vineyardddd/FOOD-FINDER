        function FoodFinder() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [firstNameInput, setFirstNameInput] = useState("");
            const [lastNameInput, setLastNameInput] = useState("");
            const [fullName, setFullName] = useState("");
            const [errorMessage, setErrorMessage] = useState("");

            const [restaurants, setRestaurants] = useState(initialRestaurants);
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCategory, setSelectedCategory] = useState("ทั้งหมด");
            
            const [selectedRestaurant, setSelectedRestaurant] = useState(null);
            const [newReview, setNewReview] = useState("");

            const categories = ["ทั้งหมด", "สตรีทฟู้ด", "ซีฟู้ด", "อาหารอีสาน", "ของหวาน", "คาเฟ่"];

            const handleLogin = (e) => {
                e.preventDefault();
                setErrorMessage("");

                if (!firstNameInput.trim() || !lastNameInput.trim()) {
                    setErrorMessage("เกิดข้อผิดพลาด: กรุณากรอกทั้งชื่อและนามสกุลให้ครบถ้วน");
                    return;
                }

                // รวมชื่อและนามสกุลเข้าด้วยกัน
                const combinedName = `${firstNameInput.trim()} ${lastNameInput.trim()}`;
                setFullName(combinedName);
                setIsLoggedIn(true);
            };

            const filteredRestaurants = restaurants.filter(rest => {
                const matchesSearch = 
                    rest.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    rest.menus.some(menu => menu.toLowerCase().includes(searchTerm.toLowerCase()));
                
                const matchesCategory = selectedCategory === "ทั้งหมด" || rest.category === selectedCategory;
                
                return matchesSearch && matchesCategory;
            });

            const handleAddReview = () => {
                if (!newReview.trim()) return;

                const reviewWithUser = `${fullName}: ${newReview}`;

                const updatedRestaurants = restaurants.map(rest => {
                    if (rest.id === selectedRestaurant.id) {
                        return { ...rest, reviews: [...rest.reviews, reviewWithUser] };
                    }
                    return rest;
                });
                
                setRestaurants(updatedRestaurants);
                
                setSelectedRestaurant({
                    ...selectedRestaurant,
                    reviews: [...selectedRestaurant.reviews, reviewWithUser]
                });
                
                setNewReview("");
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md text-center transform transition-all">
                            <div className="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
                                🍳
                            </div>
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">Food Finder</h1>
                            <p className="text-gray-500 text-sm mb-6">กรอกชื่อและนามสกุลเพื่อเข้าสู่ระบบ</p>
                            
                            {errorMessage && (
                                <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs font-medium text-left">
                                    {errorMessage}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4 text-left">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อจริง</label>
                                    <input 
                                        type="text" 
                                        placeholder="กรอกชื่อจริง..." 
                                        className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm"
                                        value={firstNameInput}
                                        onChange={(e) => setFirstNameInput(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">นามสกุล</label>
                                    <input 
                                        type="text" 
                                        placeholder="กรอกนามสกุล..." 
                                        className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm"
                                        value={lastNameInput}
                                        onChange={(e) => setLastNameInput(e.target.value)}
                                    />
                                </div>
                                <button 
                                    type="submit" 
                                    className="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3.5 rounded-xl transition-all shadow-md text-base mt-2"
                                >
                                    เข้าสู่ระบบ
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 text-gray-800 pb-12">
                    <header className="bg-amber-500 shadow-md p-4 sm:p-6 sticky top-0 z-20">
                        <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center justify-between w-full sm:w-auto">
                                <h1 className="text-2xl sm:text-3xl font-bold text-white tracking-wide cursor-pointer" onClick={() => {setSearchTerm(""); setSelectedCategory("ทั้งหมด");}}>
                                    Food Finder
                                </h1>
                                <div className="flex items-center gap-3 sm:hidden">
                                    <span className="text-white text-xs bg-amber-600/60 px-2.5 py-1 rounded-full font-medium">👤 {fullName}</span>
                                    <button 
                                        onClick={() => setIsLoggedIn(false)}
                                        className="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded-full transition-colors"
                                    >
                                        ออก
                                    </button>
                                </div>
                            </div>

                            <div className="w-full sm:w-1/2 relative">
                                <input 
                                    type="text" 
                                    placeholder="ค้นหาชื่อร้าน หรือ เมนูอาหาร..." 
                                    className="w-full py-2.5 sm:py-3 px-5 rounded-full shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-300 text-sm sm:text-base text-gray-700"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>

                            <div className="hidden sm:flex items-center gap-3">
                                <span className="text-white font-medium text-sm">👤 {fullName}</span>
                                <button 
                                    onClick={() => setIsLoggedIn(false)}
                                    className="bg-white/20 hover:bg-white/30 text-white text-sm px-4 py-2 rounded-xl transition-colors font-medium"
                                >
                                    ออกจากระบบ
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 sm:p-6 mt-2">
                        <div className="flex gap-2 sm:gap-3 mb-6 overflow-x-auto no-scrollbar py-2">
                            {categories.map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`px-4 sm:px-5 py-2 rounded-full font-medium text-sm whitespace-nowrap transition-all duration-200 flex-shrink-0 ${
                                        selectedCategory === cat 
                                        ? "bg-amber-600 text-white shadow-md scale-105" 
                                        : "bg-white text-gray-600 border border-gray-200 hover:bg-amber-50"
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        <div className="mb-6 text-gray-600 flex justify-between items-center border-b pb-2">
                            <h2 className="text-lg sm:text-xl font-semibold text-gray-800">
                                {selectedCategory === "ทั้งหมด" ? "ร้านอาหารทั้งหมด" : `หมวดหมู่: ${selectedCategory}`}
                            </h2>
                            <span className="text-sm">พบ <strong>{filteredRestaurants.length}</strong> ร้าน</span>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filteredRestaurants.map(rest => (
                                <div 
                                    key={rest.id} 
                                    onClick={() => setSelectedRestaurant(rest)} 
                                    className="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 flex flex-col h-full group cursor-pointer"
                                >
                                    <div className="overflow-hidden relative">
                                        <div 
                                            className="h-48 bg-cover bg-center transform group-hover:scale-110 transition-transform duration-500" 
                                            style={{ backgroundImage: `url('${rest.image}')` }}
                                        ></div>
                                    </div>
                                    <div className="p-4 sm:p-5 flex flex-col flex-grow">
                                        <div className="flex justify-between items-start mb-2 gap-2">
                                            <h2 className="text-base sm:text-lg font-bold text-gray-900 leading-tight">{rest.name}</h2>
                                            <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-1 rounded-md flex-shrink-0">
                                                ⭐ {rest.rating}
                                            </span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-gray-500 mb-3">{rest.category}</p>
                                        
                                        <div className="mb-4 flex-grow">
                                            <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">เมนูแนะนำ</h3>
                                            <div className="flex flex-wrap gap-1.5">
                                                {rest.menus.map((menu, idx) => (
                                                    <span key={idx} className="text-xs bg-gray-50 border border-gray-200 text-gray-600 px-2 py-1 rounded-md">
                                                        {menu}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="border-t border-gray-100 pt-3 mt-auto">
                                            <p className="text-xs sm:text-sm text-gray-600 italic line-clamp-2">"{rest.reviews[0]}"</p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {filteredRestaurants.length === 0 && (
                            <div className="text-center py-20 text-gray-500 bg-white rounded-2xl border border-dashed border-gray-300">
                                <span className="text-4xl mb-4 block">🔍</span>
                                <p className="text-lg font-medium text-gray-700">ไม่พบร้านอาหารที่คุณค้นหา</p>
                                <p className="mt-1 text-sm">ลองค้นหาด้วยคำอื่น หรือเลือกหมวดหมู่ 'ทั้งหมด'</p>
                            </div>
                        )}
                    </main>

                    {selectedRestaurant && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50 transition-opacity">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col relative animate-[fadeIn_0.2s_ease-out]">
                                
                                <button 
                                    onClick={() => setSelectedRestaurant(null)}
                                    className="absolute top-4 right-4 bg-white/90 hover:bg-white text-gray-800 rounded-full w-9 h-9 flex items-center justify-center font-bold shadow-md z-10 transition-transform hover:scale-105"
                                >
                                    ✕
                                </button>

                                <div className="h-60 sm:h-72 bg-cover bg-center flex-shrink-0" style={{ backgroundImage: `url('${selectedRestaurant.image}')` }}></div>
                                
                                <div className="p-5 sm:p-6 overflow-y-auto custom-scrollbar flex-grow">
                                    <div className="flex justify-between items-start mb-2">
                                        <h2 className="text-xl sm:text-2xl font-bold text-gray-900">{selectedRestaurant.name}</h2>
                                        <span className="bg-amber-100 text-amber-800 text-sm font-bold px-3 py-1 rounded-lg flex items-center gap-1 shadow-sm">
                                            ⭐ {selectedRestaurant.rating}
                                        </span>
                                    </div>
                                    <p className="text-xs sm:text-sm text-gray-500 mb-5 font-medium bg-gray-100 inline-block px-3 py-1 rounded-full">{selectedRestaurant.category}</p>
                                    
                                    <h3 className="font-semibold text-gray-800 mb-2.5 text-sm sm:text-base">🍽️ เมนูที่ต้องลอง</h3>
                                    <div className="flex flex-wrap gap-2 mb-6 border-b border-gray-100 pb-5">
                                        {selectedRestaurant.menus.map((menu, idx) => (
                                            <span key={idx} className="bg-amber-50 border border-amber-200 text-amber-800 px-3 py-1 rounded-lg text-xs sm:text-sm font-medium">
                                                {menu}
                                            </span>
                                        ))}
                                    </div>

                                    <h3 className="font-semibold text-gray-800 mb-2.5 text-sm sm:text-base">💬 รีวิวจากลูกค้า ({selectedRestaurant.reviews.length})</h3>
                                    <div className="space-y-2.5 mb-6 bg-gray-50 p-4 rounded-2xl border border-gray-100 max-h-44 overflow-y-auto custom-scrollbar">
                                        {selectedRestaurant.reviews.map((rev, idx) => (
                                            <div key={idx} className="bg-white p-3 rounded-xl shadow-sm text-xs sm:text-sm text-gray-700 relative pl-4">
                                                <div className="absolute left-0 top-0 bottom-0 w-1 bg-amber-400 rounded-l-xl"></div>
                                                {rev}
                                            </div>
                                        ))}
                                    </div>

                                    <h3 className="font-semibold text-gray-800 mb-2 text-sm sm:text-base">✏️ เขียนรีวิวในนาม "{fullName}"</h3>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            className="flex-grow border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-400 text-xs sm:text-sm"
                                            placeholder="พิมพ์รีวิวของคุณที่นี่..."
                                            value={newReview}
                                            onChange={(e) => setNewReview(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleAddReview()} 
                                        />
                                        <button 
                                            onClick={handleAddReview}
                                            className="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-4 sm:px-6 py-3 rounded-xl transition-colors shadow-sm text-xs sm:text-sm whitespace-nowrap"
                                        >
                                            ส่งรีวิว
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FoodFinder />);
    </script>
</body>
</html>
